name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет прежний прогон: проверять устаревший
# коммит незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff shellcheck-py

      - name: Ruff
        run: ruff check --output-format=github .

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: JSON configs
        run: |
          for f in config/*.json config/schemas/*.json data/dictionaries/*.json; do
            python -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Модель и видеокарта не нужны: в тестах модель подменена заглушкой.
      - name: Run tests
        run: python -m unittest discover -s tests/unit -v
