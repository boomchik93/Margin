[project]
name = "margin"
version = "1.0.0"
description = "Handwritten text recognition service on Qwen2.5-VL and llama.cpp"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tools", "tests/unit"]

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear: реальные ошибки и стиль, без вкусовщины
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# тесты добавляют src/ в sys.path до импорта модулей сервиса
"tests/unit/*" = ["E402"]
# логирование настраивается до импорта пайплайна: ocr и dictmatch пишут в
# журнал уже на импорте
"src/app.py" = ["E402"]

[tool.coverage.run]
source = ["src", "tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
